- name: Configure base system
  hosts: svr1
  vars:
    # LAN NIC; the nic role names the card (permanent MAC) this, outside udev's
    # predictable-name range so no other device can claim it.
    lan_interface: lan0
    # Wifi card; NetworkManager's hotspot profile is bound to this name.
    wifi_interface: wlp4s0
  roles:
    - role: apt
      tags: apt

    - role: unattended-upgrades
      tags: unattended-upgrades
      vars:
        # No scheduled reboot: the evening power-off applies the new kernel. The
        # timer covers longer continuous runs, so the upgrade window sits just
        # before it.
        uu_automatic_reboot: false
        uu_reboot_timer: true
        uu_apt_daily_oncalendar: "*-*-* 03:30"
        uu_apt_daily_upgrade_oncalendar: "*-*-* 04:00"
        uu_apt_daily_upgrade_delay: "20m"
        # Every apt source, Docker included: live-restore (docker role) keeps the
        # containers running when docker-ce/containerd upgrade.
        uu_origins_patterns:
          - "origin=*"

    - role: bash
      tags: bash

    - role: sysctl
      tags: sysctl

    - role: flatpak
      tags: flatpak

    - role: grub
      tags: grub

    - role: locale
      tags: locale

    - role: ssh
      tags: ssh

    - role: ufw
      tags: ufw

    - role: luks
      tags: luks

    - role: suspend
      tags: suspend

    - role: gtk
      tags: gtk

    - role: nic
      tags: nic
      vars:
        nic_name: "{{ lan_interface }}"

    - role: wol
      tags: wol
      vars:
        wol_interface: "{{ lan_interface }}"

    - role: avahi
      tags: avahi
      vars:
        avahi_allow_interfaces:
          - "{{ lan_interface }}"
          - "{{ wifi_interface }}"

    - role: wifi
      tags: wifi

    - role: dns
      tags: dns

    - role: wireguard
      tags: wireguard

    - role: protonvpn
      tags: protonvpn

    - role: docker
      tags: docker

    - role: trash
      tags: trash
