- name: Create the zone networks
  community.docker.docker_network:
    name: "{{ item.name }}"
    driver: bridge
    state: present
    internal: false
    enable_ipv4: true
    enable_ipv6: false
    attachable: true
    scope: local
    ipam_config:
      - subnet: "{{ item.subnet }}"
        gateway: "{{ item.gateway }}"
        iprange: "{{ item.iprange }}"
  loop: "{{ docker_zones }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Apply Docker daemon config
