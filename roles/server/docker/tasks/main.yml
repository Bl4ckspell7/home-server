- name: Create shared Docker network 'svr1-network'
  community.docker.docker_network:
    name: svr1-network
    driver: bridge
    state: present
    internal: false
    enable_ipv4: true
    enable_ipv6: false
    attachable: true
    scope: local
    ipam_config:
      - subnet: 172.21.0.0/16
  become: true

- name: Configure the Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Apply Docker daemon config
