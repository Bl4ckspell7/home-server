- name: Get current UFW rules
  ansible.builtin.shell:
    cmd: set -o pipefail && ufw status numbered | grep -E '^\[' | sed 's/\[\s*\([0-9]*\)\].*/\1/' | sort -rn
    executable: /bin/bash
  register: ufw_rule_numbers
  changed_when: false
  failed_when: false

- name: Delete all existing UFW rules
  ansible.builtin.command:
    cmd: ufw --force delete {{ item }}
  loop: "{{ ufw_rule_numbers.stdout_lines }}"
  when: ufw_rule_numbers.stdout_lines | length > 0
  changed_when: true

- name: Enable UFW logging with recommended level
  community.general.ufw:
    logging: medium

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Limit SSH to prevent brute force attacks
  community.general.ufw:
    rule: limit
    port: 22
    proto: tcp
    comment: "Limit SSH access to reduce brute-force attempts"

- name: Allow LocalSend incoming on port 53317
  community.general.ufw:
    rule: allow
    port: 53317
    proto: tcp
    comment: "Allow LocalSend traffic"

- name: Allow DNS from svr1-network to host dnscrypt-proxy
  community.general.ufw:
    rule: allow
    src: 172.21.0.0/16
    port: 5354
    proto: "{{ item }}"
    comment: "Docker containers (pi-hole) -> dnscrypt-proxy on bridge gateway"
  loop:
    - udp
    - tcp

# Duplicates Debian's stock before.rules, but survives edits to them and shows
# up in `ufw status`; avahi publishes svr1.local, which inventory.yml uses.
# IPv4 only: IPv6 is off on this host (sysctl and nic roles).
- name: Allow mDNS for avahi
  community.general.ufw:
    rule: allow
    to_ip: 224.0.0.251
    to_port: "5353"
    proto: udp
    comment: "mDNS (avahi, svr1.local)"

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled
