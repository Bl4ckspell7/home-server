- name: Get current UFW rules
  ansible.builtin.shell:
    cmd: set -o pipefail && ufw status numbered | grep -E '^\[' | sed 's/\[\s*\([0-9]*\)\].*/\1/' | sort -rn
    executable: /bin/bash
  register: ufw_rule_numbers
  changed_when: false
  failed_when: false

- name: Delete all existing UFW rules
  ansible.builtin.command:
    cmd: ufw --force delete {{ item }}
  loop: "{{ ufw_rule_numbers.stdout_lines }}"
  when: ufw_rule_numbers.stdout_lines | length > 0
  changed_when: true

- name: Enable UFW logging with recommended level
  community.general.ufw:
    logging: medium

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow

# First rule: ufw stops at the first match, so it must precede the SSH limit.
- name: Deny svr1-game to the host
  community.general.ufw:
    rule: deny
    src: 172.28.6.0/24
    comment: "svr1-game (internet-facing Minecraft): no host services"

- name: Limit SSH to prevent brute force attacks
  community.general.ufw:
    rule: limit
    port: 22
    proto: tcp
    comment: "Limit SSH access to reduce brute-force attempts"

- name: Allow LocalSend incoming on port 53317
  community.general.ufw:
    rule: allow
    port: 53317
    proto: tcp
    comment: "Allow LocalSend traffic"

# Only Pi-hole needs an upstream; every other container asks Pi-hole.
- name: Allow DNS from Pi-hole to host dnscrypt-proxy
  community.general.ufw:
    rule: allow
    src: 172.28.1.254
    port: 5354
    proto: "{{ item }}"
    comment: "Pi-hole (svr1-edge) -> dnscrypt-proxy on bridge gateway"
  loop:
    - udp
    - tcp

# Duplicates Debian's stock before.rules, but survives edits to them and shows
# up in `ufw status`; avahi publishes svr1.local, which inventory.yml uses.
# IPv4 only: IPv6 is off on this host (sysctl, nic and wifi roles).
- name: Allow mDNS for avahi
  community.general.ufw:
    rule: allow
    to_ip: 224.0.0.251
    to_port: "5353"
    proto: udp
    comment: "mDNS (avahi, svr1.local)"

# svr1-game holds the internet-facing Minecraft server: internet and Pi-hole's DNS
# only, none of the LAN, the other zones or the VPS over wg0. DOCKER-USER runs before
# Docker's FORWARD rules; declaring it here refills it on every ufw (re)load.
- name: Restrict svr1-game egress to the internet
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK svr1-game egress"
    insertafter: EOF
    owner: root
    group: root
    mode: "0640"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -s 172.28.6.0/24 -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
      -A DOCKER-USER -s 172.28.6.0/24 -d 172.28.6.254 -p udp --dport 53 -j RETURN
      -A DOCKER-USER -s 172.28.6.0/24 -d 172.28.6.254 -p tcp --dport 53 -j RETURN
      -A DOCKER-USER -s 172.28.6.0/24 -d 10.0.0.0/8 -j DROP
      -A DOCKER-USER -s 172.28.6.0/24 -d 172.16.0.0/12 -j DROP
      -A DOCKER-USER -s 172.28.6.0/24 -d 192.168.0.0/16 -j DROP
      -A DOCKER-USER -s 172.28.6.0/24 -d 100.64.0.0/10 -j DROP
      -A DOCKER-USER -s 172.28.6.0/24 -d 169.254.0.0/16 -j DROP
      COMMIT
  notify: Reload UFW

- name: Ensure UFW is enabled
  community.general.ufw:
    state: enabled
