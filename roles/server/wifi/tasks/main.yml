# On a weak hotspot link the dozing card misses frames and the server drops off
# the network for minutes. A global default covers every wifi profile left at
# 802-11-wireless.powersave=default.
- name: Disable wifi power save in NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/wifi-powersave.conf
    content: |
      [connection]
      # 2 = disable
      wifi.powersave=2
    owner: root
    group: root
    mode: "0644"
  notify: Reload NetworkManager config

- name: Reload NetworkManager config now
  # Not at play end, so a later failing role can't leave the file changed but
  # never loaded.
  ansible.builtin.meta: flush_handlers

- name: Find wifi devices
  ansible.builtin.command:
    cmd: nmcli -g DEVICE,TYPE device
  register: wifi_nm_devices
  changed_when: false
  check_mode: false

- name: Read power save state of wifi devices
  ansible.builtin.command:
    cmd: iw dev {{ item }} get power_save
  loop: "{{ wifi_devices }}"
  vars:
    wifi_devices: "{{ wifi_nm_devices.stdout_lines | select('match', '.+:wifi$') | map('regex_replace', ':wifi$', '') | list }}"
  register: wifi_power_save
  changed_when: false
  check_mode: false

- name: Turn power save off on running wifi devices
  # NM applies the drop-in only on activation; reactivating would drop the link
  # Ansible runs over.
  ansible.builtin.command:
    cmd: iw dev {{ item.item }} set power_save off
  loop: "{{ wifi_power_save.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: "'Power save: on' in item.stdout"
  changed_when: true

# NetworkManager re-enables IPv6 on interfaces it configures (see the nic role),
# so IPv6 is switched off in every wifi profile.
- name: Find wifi connections
  ansible.builtin.command:
    cmd: nmcli -g UUID,TYPE,DEVICE connection show
  register: wifi_nm_connections
  changed_when: false
  check_mode: false

- name: Read IPv6 method of wifi connections
  ansible.builtin.command:
    cmd: nmcli -g ipv6.method connection show uuid {{ item.split(':')[0] }}
  loop: "{{ wifi_nm_connections.stdout_lines | select('search', ':802-11-wireless:') | list }}"
  register: wifi_ipv6_methods
  changed_when: false
  check_mode: false

- name: Disable IPv6 in wifi connections
  ansible.builtin.command:
    cmd: nmcli connection modify uuid {{ item.item.split(':')[0] }} ipv6.method disabled
  loop: "{{ wifi_ipv6_methods.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout != 'disabled'
  changed_when: true

- name: Apply the connections to active wifi devices
  # Right after the modify instead of a handler, so a later failing role can't
  # leave a profile changed on disk but not applied. Reapply keeps the link up.
  ansible.builtin.command:
    cmd: nmcli device reapply {{ item.item.split(':')[2] }}
  loop: "{{ wifi_ipv6_methods.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stdout != 'disabled'
    - item.item.split(':')[2] | length > 0
  changed_when: true
