---
# false: tunnel stopped and disabled, config left in place (break-glass).
protonvpn_enabled: true
# IPv6 minimum: fits through any uplink, including the phone hotspot.
protonvpn_mtu: 1280
# Also the routing table wg-quick uses. wg0 carries the same mark so the VPS
# tunnel bypasses Proton: keep roles/server/wireguard's wg0.conf.j2 in sync.
protonvpn_fwmark: 51820
# Dead-man: the tunnel turns itself off unless a (re)start is verified in time.
protonvpn_rollback_seconds: 300
# WireGuard rekeys every 120 s (measured 120-127 s here) and drops keys at
# 180 s: an older handshake means the tunnel carries nothing.
protonvpn_watchdog_stale_seconds: 180
# Time a new source port or server gets to handshake before the next step.
# The timer runs every minute, so less acts like 60.
protonvpn_watchdog_retry_seconds: 60
