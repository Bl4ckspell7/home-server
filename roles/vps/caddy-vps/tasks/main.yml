---
- name: Ensure Caddy config directory exists
  ansible.builtin.file:
    path: /opt/caddy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Caddy log directory exists
  # Bind-mounted into the container; fail2ban parses access.log from the host.
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Caddy access log file exists
  # fail2ban refuses to start a jail whose logpath is missing, and Caddy only
  # creates this file on its first request after restart — which happens in a
  # handler at the end of the play, long after fail2ban-vps has been configured.
  # Pre-creating it breaks that ordering dependency; Caddy just appends.
  # touch + preserve timestamps keeps the task idempotent.
  ansible.builtin.file:
    path: /var/log/caddy/access.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Write Caddy environment file
  # The Caddyfile is a static file using Caddy's own {$VAR} substitution, so the
  # two values that vary per host arrive as container env instead of Jinja. The
  # IP comes from facts and is never committed, matching the DNS/Terraform setup.
  ansible.builtin.copy:
    content: |
      BASE_DOMAIN={{ base_domain }}
      VPS_IP={{ ansible_facts['default_ipv4']['address'] }}
    dest: /etc/caddy-vps.env
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Copy Caddyfile
  ansible.builtin.copy:
    src: Caddyfile
    dest: /opt/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Copy Caddy Quadlet unit
  ansible.builtin.copy:
    src: caddy.container
    dest: /etc/containers/systemd/caddy.container
    owner: root
    group: root
    mode: "0644"
  notify: Restart Caddy

- name: Start Caddy (Quadlet-generated service)
  ansible.builtin.systemd_service:
    name: caddy.service
    state: started
    daemon_reload: true
