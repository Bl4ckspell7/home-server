# Every request, counted per source IP — the flood-control input for the
# caddy-rate jail.
#
# Matching every access line is intentional: Anubis returns HTTP 200 for its
# challenge, so a scanner being blocked is indistinguishable from a normal visit
# by status. Volume is the only thing left to measure.
#
# The jail using this filter ships DISABLED. Home devices reach these services via
# the public domain, so the entire household shares one source IP at this hop —
# see the sizing note in templates/jail.local.j2 before enabling.

[Definition]

datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S

failregex = ^\{.*"logger":"http\.log\.access[^"]*".*"remote_ip":"<HOST>"

ignoreregex =
