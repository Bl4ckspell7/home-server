# Vulnerability-scanner path probes in Caddy's JSON access log.
#
# Matches only paths no legitimate client ever requests, so two strikes is safe.
# Status codes are deliberately NOT used: Anubis answers its bot challenge with
# HTTP 200, so a blocked scanner looks identical to a served page. Path is the
# only reliable signal here.
#
# Log line shape (see roles/vps/caddy-vps/templates/Caddyfile.j2, access_log):
#   {"level":"info","ts":"2026-08-17T11:23:30.226Z","logger":"http.log.access.log0",
#    "msg":"handled request","request":{"remote_ip":"1.2.3.4",...,"uri":"/.env",...},...}
# remote_ip is the true client: the VPS is the internet edge and sets no
# trusted_proxies.

[Definition]

datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S

failregex = ^\{.*"remote_ip":"<HOST>".*"uri":"(?:/\.env|/\.git/|/\.aws/|/\.ssh/|/\.svn/|/\.DS_Store|/wp-|/vendor/|/phpinfo|/phpmyadmin|/pma/|/cgi-bin/|/server-status|/server-info|/_cat/|/app/kibana|/v2/api-docs|/swagger-ui|/openapi\.json)

ignoreregex =
