<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Be right back</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: #0f1117;
        color: #e6e8ee;
        padding: 2rem;
      }
      .card {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #9aa3b2;
        font-size: 1.05rem;
      }
      .dot {
        display: inline-block;
        width: 0.6rem;
        height: 0.6rem;
        margin-right: 0.5rem;
        border-radius: 50%;
        background: #f5a623;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1><span class="dot"></span>Be right back</h1>
      <p>
        This service is temporarily unavailable and will return shortly. Thanks
        for your patience.
      </p>
    </main>
  </body>
</html>
