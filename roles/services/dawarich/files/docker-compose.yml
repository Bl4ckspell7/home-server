name: dawarich

x-variables:
  # shared variables for dawarich services (app and postgres)
  # renovate: datasource=docker depName=docker.io/freikin/dawarich
  dawarich_image: &dawarich_image docker.io/freikin/dawarich:1.19.0@sha256:d9385242202ae385a5d8064f41a59a0b58218399e60e7e499d2a6afb449bc304
  app_hosts: &app_hosts localhost,dawarich.${BASE_DOMAIN:?base domain required}
  database_host: &database_host dawarich-postgres
  database_name: &database_name dawarich_development
  database_port: &database_port 5432
  database_username: &database_username postgres
  pgid: &pgid 1000
  photon_api_host: &photon_api_host photon.lan:2322
  photon_api_use_https: &photon_api_use_https false
  prometheus_enabled: &prometheus_enabled "false"
  puid: &puid 1000
  rails_env: &rails_env production
  rails_log_to_stdout: &rails_log_to_stdout true
  redis_url: &redis_url redis://dawarich-valkey:6379
  self_hosted: &self_hosted true
  store_geodata: &store_geodata true

services:
  dawarich-valkey:
    container_name: dawarich-valkey
    image: docker.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: >
      valkey-server
      --save 900 1
      --save 300 10
      --appendonly no
    networks:
      default:
    volumes:
      - dawarich_valkey:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich-postgres:
    container_name: dawarich-postgres
    image: docker.io/postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    # image: docker.io/imresamu/postgis:17-3.5-alpine # If you're on ARM architecture, use this image instead
    shm_size: 1G
    volumes:
      - dawarich_db_data:/var/lib/postgresql/data
      - dawarich_shared:/var/shared
    networks:
      default:
    env_file: .env
    environment:
      POSTGRES_USER: *database_username
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: *database_name
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dawarich_development}",
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    # command: postgres -c config_file=/etc/postgresql/postgresql.conf # Use custom config, uncomment if you want to use a custom config

  dawarich-app:
    container_name: dawarich-app
    image: *dawarich_image
    volumes:
      - dawarich_public:/var/app/public
      - dawarich_watched:/var/app/tmp/imports/watched
      - dawarich_storage:/var/app/storage
      - dawarich_db_data:/dawarich_db_data
    networks:
      default:
      svr1-network:
        ipv4_address: 172.21.255.244
    dns:
      - 172.21.255.254
    dns_search: # don't append any search domain
      - "."
    expose:
      - "3000"
      # - "${DAWARICH_APP_PORT:-3000}:3000"
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      ALLOW_EMAIL_PASSWORD_LOGIN: "false"
      ALLOW_EMAIL_PASSWORD_REGISTRATION: "false"
      APPLICATION_HOSTS: *app_hosts
      APPLICATION_PROTOCOL: http
      BACKGROUND_PROCESSING_CONCURRENCY: ${BACKGROUND_PROCESSING_CONCURRENCY:-2}
      DATABASE_HOST: *database_host
      DATABASE_NAME: *database_name
      DATABASE_PORT: *database_port
      DATABASE_USERNAME: *database_username
      DISABLE_TELEMETRY: true
      DISTANCE_UNIT: "km"
      OIDC_AUTO_REGISTER: "true"
      OIDC_CLIENT_ID: ${AUTHENTIK_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET}
      OIDC_ISSUER: "https://authentik.${BASE_DOMAIN:?base domain required}/application/o/dawarich/"
      OIDC_PROVIDER_NAME: "Authentik" # optional, default is OpenID Connect
      OIDC_REDIRECT_URI: "https://dawarich.${BASE_DOMAIN:?base domain required}/users/auth/openid_connect/callback"
      PGID: *pgid
      PHOTON_API_HOST: *photon_api_host
      PHOTON_API_USE_HTTPS: *photon_api_use_https
      PROMETHEUS_EXPORTER_ENABLED: *prometheus_enabled
      PUID: *puid
      RAILS_ENV: *rails_env
      RAILS_LOG_TO_STDOUT: *rails_log_to_stdout
      REDIS_URL: *redis_url
      SELF_HOSTED: *self_hosted
      SIDEKIQ_EMBEDDED: "true" # background jobs run inside this container
      STORE_GEODATA: *store_geodata
      TIME_ZONE: Europe/Berlin
      WEB_CONCURRENCY: "0" # must be 0: each extra web process starts its own job threads
    logging:
      driver: "json-file"
      options:
        max-size: ${LOG_MAX_SIZE:-100m}
        max-file: ${LOG_MAX_FILE:-5}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'",
        ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich-postgres:
        condition: service_healthy
        restart: true
      dawarich-valkey:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          cpus: ${APP_CPU_LIMIT:-1.00}
          memory: ${APP_MEMORY_LIMIT:-4G}

volumes:
  dawarich_db_data:
  dawarich_shared:
  dawarich_valkey:
  dawarich_public:
  dawarich_watched:
  dawarich_storage:

networks:
  default:
    driver: bridge
  svr1-network:
    external: true
