name: anubis
services:
  anubis:
    container_name: anubis
    image: ghcr.io/techarohq/anubis:v1.26.2@sha256:f7af22049b33ce1cdefa903f0920f8306aaf61c10e85c03dda708f264e163d51
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.236
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    environment:
      BIND: ":3000"
      TARGET: "http://caddy.lan:8080"
      COOKIE_DOMAIN: ".bl4ckspell.freeddns.org"
    healthcheck:
      test: ["CMD", "/ko-app/anubis", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-network:
    external: true
