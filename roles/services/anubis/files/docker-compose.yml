name: anubis
services:
  anubis:
    container_name: anubis
    image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.236
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    environment:
      BIND: ":3000"
      TARGET: "http://caddy.lan:8080"
      COOKIE_DOMAIN: ".${BASE_DOMAIN:?base domain required}"
    healthcheck:
      test: ["CMD", "/ko-app/anubis", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-network:
    external: true
