services:
  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: always
    ports:
      # - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    expose:
      - "8080"
    environment:
      # Caddy expands {$BASE_DOMAIN} in the Caddyfile from its own process
      # environment, so unlike the other services this one needs the value inside
      # the container, not just at compose-parse time.
      BASE_DOMAIN: ${BASE_DOMAIN:?base domain required}
    networks:
      svr1-network:
        ipv4_address: 172.21.255.238
    dns:
      - 172.21.255.254
    dns_search: # don't append any search domain
      - "."
    volumes:
      - ./conf:/etc/caddy
      # - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  svr1-network:
    external: true
