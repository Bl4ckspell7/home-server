services:
  caddy:
    container_name: caddy
    image: docker.io/library/caddy:2.11.9@sha256:0c2243efcf437ab7f7a978f1027fcf0d4f9be8a75df27b1b3fbc5dbe0ffa8cf0
    restart: always
    ports:
      # - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
    expose:
      - "8080"
      - "8081"
    environment:
      # Caddy expands {$BASE_DOMAIN} in the Caddyfile from its own process
      # environment, so unlike the other services this one needs the value inside
      # the container, not just at compose-parse time.
      BASE_DOMAIN: ${BASE_DOMAIN:?base domain required}
      # Anubis's ipv4_address (roles/services/anubis): the only client :8080 accepts.
      ANUBIS_IP: 172.28.1.236
      # Homepage's ipv4_address (roles/services/homepage): the only client :8081 accepts.
      HOMEPAGE_IP: 172.28.2.246
    # In every zone (like Pi-hole): it proxies to all of them.
    networks:
      svr1-edge:
        aliases: [caddy.lan]
      svr1-apps:
        aliases: [caddy.lan]
      svr1-admin:
        aliases: [caddy.lan]
      svr1-llm:
        aliases: [caddy.lan]
      svr1-ci:
        aliases: [caddy.lan]
    # The netns inherits the host's ip_forward=1; in every zone, that would route
    # packets between zones past Docker's isolation.
    sysctls:
      net.ipv4.ip_forward: 0
    dns:
      - 172.28.1.254
    dns_search: # don't append any search domain
      - "."
    volumes:
      - ./conf:/etc/caddy
      # - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  svr1-edge:
    external: true
  svr1-apps:
    external: true
  svr1-admin:
    external: true
  svr1-llm:
    external: true
  svr1-ci:
    external: true
