name: homepage
services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.2.0@sha256:753eeb0cc22ab7baad39ed47cbd1aae14e193dd1b264e965f193a9ea1d1e1bdd
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.246
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - ./icons:/app/public/icons
    environment:
      # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      HOMEPAGE_ALLOWED_HOSTS: "192.168.178.117:3000,${BASE_DOMAIN:?base domain required},homepage.${BASE_DOMAIN:?base domain required}"
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    healthcheck:
      disable: false

networks:
  svr1-network:
    external: true
