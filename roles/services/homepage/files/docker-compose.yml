name: homepage
services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.246
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - ./icons:/app/public/icons
    environment:
      # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      HOMEPAGE_ALLOWED_HOSTS: "192.168.178.117:3000,${BASE_DOMAIN:?base domain required},homepage.${BASE_DOMAIN:?base domain required}"
      PUID: 909 # homepage service user, must own ./config (see role tasks)
      PGID: 909
    healthcheck:
      disable: false

networks:
  svr1-network:
    external: true
