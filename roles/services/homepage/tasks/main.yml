---
- name: Configure Homepage service user
  ansible.builtin.include_tasks: ../../../../tasks/service_user.yml
  vars:
    service_name: homepage
    service_uid: 909
    # The entrypoint runs `chown -R PUID:PGID /app/config` whenever the dir's
    # owner differs from PUID:PGID. Owned by the service user it is left alone,
    # so the config files copied below stay root-owned, while homepage can
    # still write logs/ and its skeleton files.
    service_dirs:
      - /opt/stacks/homepage/config

- name: Ensure Homepage icons directory exists
  ansible.builtin.file:
    path: /opt/stacks/homepage/icons
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Homepage config files
  ansible.builtin.copy:
    src: "config/{{ item }}"
    dest: "/opt/stacks/homepage/config/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bookmarks.yaml
    - services.yaml
    - settings.yaml
    - widgets.yaml
    - custom.js

- name: Copy Homepage icons
  ansible.builtin.copy:
    src: "icons/"
    dest: "/opt/stacks/homepage/icons/"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Homepage
  ansible.builtin.include_tasks: ../../../../tasks/deploy_stack.yml
  vars:
    service_name: homepage
    env_template: homepage.env.j2
