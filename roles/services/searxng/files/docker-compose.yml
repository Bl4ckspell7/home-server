name: searxng
services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a
    restart: unless-stopped
    # Leak guard, not a sizing target: ~30M idle.
    mem_limit: 512m
    expose:
      - "8080"
    networks:
      svr1-llm:
        aliases: [searxng.lan]
    dns:
      - 172.28.4.254
    dns_search:
      - "."
    env_file: .env
    environment:
      TZ: Europe/Berlin
      # OpenSearch and result links point at the public name, not searxng.lan.
      SEARXNG_BASE_URL: https://searxng.${BASE_DOMAIN:?base domain required}/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-llm:
    external: true
