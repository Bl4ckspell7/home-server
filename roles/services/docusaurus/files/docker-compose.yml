name: docusaurus

services:
  docusaurus:
    image: forgejo.bl4ckspell.de/bl4ckspell/home-server-docs:1.1.8@sha256:f885ff9ea0954676442daa2c670e9b4416faa95612ee15913e4d289724c9226c
    container_name: docusaurus
    restart: unless-stopped
    networks:
      svr1-apps:
        aliases: [docs.lan]
    dns:
      - 172.28.2.254
    dns_search:
      - "."
    expose:
      - "8349"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8349/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-apps:
    external: true
