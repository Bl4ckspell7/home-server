name: docusaurus

services:
  docusaurus:
    image: forgejo.bl4ckspell.de/bl4ckspell/home-server-docs:1.1.4@sha256:e1392dffb46ccab41e465de79db18105f6c66b3a4a02494b462c7b8faa491eab
    container_name: docusaurus
    restart: unless-stopped
    networks:
      svr1-network:
        ipv4_address: 172.21.255.233
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    expose:
      - "8349"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8349/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-network:
    external: true
