# Forgejo Actions runner.
#
# Job isolation: the runner does NOT touch the host Docker socket. A dedicated
# Docker-in-Docker daemon (`dind`) runs the job containers. dind is privileged,
# i.e. root-equivalent on svr1, so jobs must never reach its socket:
# config.yml sets `docker_host: "-"`.
#
# The runner polls Forgejo at http://forgejo.lan:3000 (direct via svr1-ci,
# bypasses caddy/anubis). Nothing connects TO the runner — outbound only.
name: forgejo-runner
services:
  runner:
    image: data.forgejo.org/forgejo/runner:13.2.2@sha256:a8543a45fe62bebef0534d5c223cf485d3294e6dd2e42a82dbcbfd40c54a6a22
    container_name: forgejo-runner
    user: 904:904
    restart: unless-stopped
    environment:
      DOCKER_HOST: unix:///sock/docker.sock
    command: ["forgejo-runner", "daemon", "--config", "/config.yml"]
    volumes:
      - ./data:/data
      - ./config.yml:/config.yml:ro
      - dind_sock:/sock
    networks:
      forgejo-runner:
      svr1-ci:
    dns:
      - 172.28.5.254
    dns_search:
      - "."
    depends_on:
      dind:
        condition: service_healthy

  dind:
    image: docker.io/library/docker:29.10.0-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
    container_name: forgejo-runner-dind
    restart: unless-stopped
    # Required to run a nested Docker daemon. Privileged = host root, so only
    # the runner may use the socket (see the header).
    privileged: true
    # API only as unix socket on the shared volume — no network listener.
    # --group=904 grants the non-root runner socket access (numeric gid, no
    # named group needed inside the image).
    command: ["--host=unix:///sock/docker.sock", "--group=904"]
    volumes:
      - dind_data:/var/lib/docker
      - dind_sock:/sock
    networks:
      forgejo-runner:
      # Job containers NAT out through dind, so dind needs svr1-ci for checkouts
      # from forgejo.lan. Jobs resolve it through dind's Docker DNS, which only
      # works on the per-job network the runner creates (default bridge falls
      # back to 8.8.8.8), so keep container.network empty in config.yml.
      svr1-ci:
    dns:
      - 172.28.5.254
    dns_search:
      - "."
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_HOST=unix:///sock/docker.sock docker info >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  dind_data:
    name: forgejo_runner_dind_data
  dind_sock:
    name: forgejo_runner_dind_sock

networks:
  forgejo-runner:
    external: false
  svr1-ci:
    external: true
