---
- name: Configure Forgejo service user
  ansible.builtin.include_tasks: ../../../../tasks/service_user.yml
  vars:
    service_name: forgejo
    service_uid: 902
    service_dirs:
      - /opt/stacks/forgejo/forgejo
      - /opt/stacks/forgejo/conf

- name: Copy Forgejo backup script
  ansible.builtin.copy:
    src: backup.sh
    dest: /opt/stacks/forgejo/backup.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy Forgejo
  ansible.builtin.include_tasks: ../../../../tasks/deploy_stack.yml
  vars:
    service_name: forgejo
    service_secrets: true
    env_template: forgejo.env.j2
