name: forgejo
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.2-rootless@sha256:23ccc146e6dc2cd1f5c5435909baae64db873201717f1726490dae649283e6cd
    container_name: forgejo
    user: 902:902
    env_file: .env
    environment:
      # The custom runtime UID is not in the rootless image's passwd file, so
      # Forgejo falls back to USER when matching its identity to RUN_USER.
      USER: git
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      # Written into $GITEA_APP_INI (/var/lib/gitea/custom/conf/app.ini) by the
      # image's environment-to-ini entrypoint on every start. ROOT_URL is what the
      # container registry builds its WWW-Authenticate token realm from, so a stale
      # value here breaks `podman login`/pull even though the packages are fine.
      FORGEJO__server__ROOT_URL: https://forgejo.${BASE_DOMAIN:?base domain required}/
      FORGEJO__server__DOMAIN: forgejo.${BASE_DOMAIN:?base domain required}
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__START_SSH_SERVER: "false"
    restart: unless-stopped
    networks:
      forgejo:
      svr1-network:
        ipv4_address: 172.21.255.235
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    volumes:
      - ./forgejo:/var/lib/gitea
      - ./conf:/etc/gitea
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    depends_on:
      - forgejo-postgres
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  forgejo-postgres:
    image: docker.io/library/postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: forgejo-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      POSTGRES_DB: forgejo
    networks:
      - forgejo
    volumes:
      - forgejo_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  forgejo_pgdata:
    name: forgejo_pgdata

networks:
  forgejo:
    external: false
  svr1-network:
    external: true
