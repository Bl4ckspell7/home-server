---
- name: Configure Authentik service user
  ansible.builtin.include_tasks: ../../../../tasks/service_user.yml
  vars:
    service_name: authentik
    service_uid: 906

- name: Ensure stack directory exists
  # Must precede the writable dirs below: ansible.builtin.file applies the
  # task's owner/mode to every intermediate directory it creates, so on a fresh
  # host /opt/stacks itself would become authentik:authentik 0750.
  ansible.builtin.file:
    path: /opt/stacks/authentik
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Authentik writable directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: authentik
    group: authentik
    mode: "{{ item.mode }}"
  loop: "{{ authentik_writable_dirs }}"
  loop_control:
    label: "{{ item.path }}"

- name: Ensure Authentik blueprints directory exists
  ansible.builtin.file:
    path: /opt/stacks/authentik/blueprints
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure Authentik media directories exist
  ansible.builtin.file:
    path: "/opt/stacks/authentik/{{ item }}"
    state: directory
    owner: authentik
    group: authentik
    mode: "0755"
  loop:
    - data/media
    - data/media/public
    - data/media/public/application-icons

- name: Copy application icons to Authentik media
  # App-dashboard tiles are fetched client-side, so a CDN icon renders
  # intermittently and leaks a request per tile. Authentik serves these from
  # data/media/public/, and the blueprint references them as the bare subpath
  # `application-icons/<file>` — no leading slash, no `public/` prefix.
  ansible.builtin.copy:
    src: application-icons/
    dest: /opt/stacks/authentik/data/media/public/application-icons/
    owner: authentik
    group: authentik
    mode: "0644"

- name: Render Authentik application blueprint
  # No secrets are needed here: credentials are referenced with !Env and resolved
  # by the container from .env, which deploy_stack renders below.
  ansible.builtin.template:
    src: apps.yaml.j2
    dest: /opt/stacks/authentik/blueprints/apps.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Authentik worker

- name: Copy Authentik brand blueprint
  # Own file, not part of apps.yaml: a failing entry rolls back its whole
  # blueprint, and apps.yaml owns the entire application catalog.
  ansible.builtin.copy:
    src: brand.yaml
    dest: /opt/stacks/authentik/blueprints/brand.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart Authentik worker

- name: Remove superseded proxy-apps blueprint
  # Replaced by apps.yaml. Deleting the file does NOT remove anything it created
  # in Authentik — that is what the tombstone entries in apps.yaml are for — but
  # leaving it would keep re-creating the objects it still declares.
  ansible.builtin.file:
    path: /opt/stacks/authentik/blueprints/proxy-apps.yaml
    state: absent
  notify: Restart Authentik worker

- name: Deploy Authentik
  ansible.builtin.include_tasks: ../../../../tasks/deploy_stack.yml
  vars:
    service_name: authentik
    service_secrets: true
    env_template: authentik.env.j2
