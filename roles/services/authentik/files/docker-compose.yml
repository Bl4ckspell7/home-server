name: authentik

x-variables:
  # renovate: datasource=docker depName=ghcr.io/goauthentik/server
  authentik_image: &authentik_image ghcr.io/goauthentik/server:2026.8.1@sha256:9d605ed569ff9f39146be39da93714b2acf19072acc4ab0f0e2f2d81be88cdce

services:
  authentik-server:
    container_name: authentik-server
    image: *authentik_image
    restart: unless-stopped
    command: server
    user: "906:906"
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    env_file:
      - .env
    expose:
      - "9443"
    networks:
      default:
      svr1-network:
        ipv4_address: 172.21.255.253
    dns:
      - 172.21.255.254
    dns_search: # don't append any search domain
      - "."
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    depends_on:
      authentik-postgresql:
        condition: service_healthy
  authentik-worker:
    container_name: authentik-worker
    image: *authentik_image
    restart: unless-stopped
    command: worker
    user: "906:906"
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    depends_on:
      authentik-postgresql:
        condition: service_healthy
  authentik-postgresql:
    container_name: authentik-postgresql
    image: docker.io/library/postgres:16.15-alpine@sha256:ab5c955e9e57ae9879d4411ab49a912be9d162455676f7bf56e951b11ac73785
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

volumes:
  database:
    driver: local

networks:
  default:
    driver: bridge
  svr1-network:
    external: true
