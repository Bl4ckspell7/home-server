name: authentik

x-variables:
  # renovate: datasource=docker depName=ghcr.io/goauthentik/server
  authentik_image: &authentik_image ghcr.io/goauthentik/server:2026.8.6@sha256:da89d8338a3b1889800eb033fd61f8d43f7aa9a1c5a042cb5e03d891b1f0c56c

services:
  authentik-server:
    container_name: authentik-server
    image: *authentik_image
    restart: unless-stopped
    command: server
    user: "906:906"
    volumes:
      - ./data:/data
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    env_file:
      - .env
    expose:
      - "9443"
    networks:
      default:
      svr1-edge:
        aliases: [authentik.lan]
    dns:
      - 172.28.1.254
    dns_search: # don't append any search domain
      - "."
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    depends_on:
      authentik-postgresql:
        condition: service_healthy
  authentik-worker:
    container_name: authentik-worker
    image: *authentik_image
    restart: unless-stopped
    command: worker
    user: "906:906"
    volumes:
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
      - ./blueprints:/blueprints/custom:ro
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
    depends_on:
      authentik-postgresql:
        condition: service_healthy
  authentik-postgresql:
    container_name: authentik-postgresql
    image: docker.io/library/postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - database:/var/lib/postgresql
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}

volumes:
  database:
    driver: local

networks:
  default:
    driver: bridge
  svr1-edge:
    external: true
