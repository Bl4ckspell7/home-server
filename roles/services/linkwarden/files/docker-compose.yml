name: linkwarden
services:
  linkwarden:
    container_name: linkwarden
    image: ghcr.io/linkwarden/linkwarden:v2.16.0@sha256:d805877fb707d160b809027c302f84cfba11a248d7fdc12de90b4791f98e6b55
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      default:
      svr1-network:
        ipv4_address: 172.21.255.250
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@linkwarden-postgres:5432/postgres
      NEXT_PUBLIC_OLLAMA_ENDPOINT_URL: http://ollama.lan:11434
      OLLAMA_MODEL: mistral
    volumes:
      - ./data:/data/data
    depends_on:
      - linkwarden-postgres
      - linkwarden-meilisearch
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  linkwarden-postgres:
    container_name: linkwarden-postgres
    image: docker.io/library/postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  linkwarden-meilisearch:
    container_name: linkwarden-meilisearch
    image: docker.io/getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    driver: bridge
  svr1-network:
    external: true
