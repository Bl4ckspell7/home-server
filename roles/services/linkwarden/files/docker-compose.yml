name: linkwarden
services:
  linkwarden:
    container_name: linkwarden
    image: ghcr.io/linkwarden/linkwarden:v2.17.0@sha256:7c11fde57d1a0c819b6de0079966eba3a33584d718464af7dacde22bd470ae46
    restart: unless-stopped
    user: "908:908"
    expose:
      - "3000"
    networks:
      default:
      svr1-network:
        ipv4_address: 172.21.255.250
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    env_file: .env
    environment:
      # No trailing slash: NextAuth appends /.well-known/…, `//` is a 404.
      AUTHENTIK_ISSUER: https://authentik.${BASE_DOMAIN:?base domain required}/application/o/linkwarden
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@linkwarden-postgres:5432/postgres
      DISABLE_NEW_SSO_USERS: "false"
      # Interpolated from BASE_DOMAIN in .env rather than baked into the env
      # template, matching vaultwarden/dawarich/paperless. This is the OIDC
      # callback URL -- a wrong value breaks login while the site still loads.
      NEXTAUTH_URL: https://linkwarden.${BASE_DOMAIN:?base domain required}/api/v1/auth
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "false"
      NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
      # AI tagging via the local llama.cpp (OpenAI-compatible). It has no API key, but
      # Linkwarden only enables AI when OPENAI_API_KEY is set.
      CUSTOM_OPENAI_BASE_URL: http://llamacpp.lan:8080/v1
      CUSTOM_OPENAI_NAME: llamacpp
      OPENAI_API_KEY: none
      OPENAI_MODEL: gemma4-26b-a4b-iq2m
    volumes:
      - ./data:/data/data
    depends_on:
      - linkwarden-postgres
      - linkwarden-meilisearch
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  linkwarden-postgres:
    container_name: linkwarden-postgres
    image: docker.io/library/postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  linkwarden-meilisearch:
    container_name: linkwarden-meilisearch
    image: docker.io/getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_UPGRADE_DB=true
    volumes:
      - ./meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    driver: bridge
  svr1-network:
    external: true
