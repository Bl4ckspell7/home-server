name: radicale
services:
  radicale:
    image: ghcr.io/kozea/radicale:3.9.2@sha256:c74545ef669a3166646ec13438a31b5d0bfff198d8ba7ecd214c0a5f40f03fb4
    container_name: radicale
    user: 903:903
    restart: unless-stopped
    networks:
      svr1-apps:
        aliases: [radicale.lan]
    dns:
      - 172.28.2.254
    dns_search:
      - "."
    volumes:
      - ./config:/etc/radicale:ro
      - ./data:/var/lib/radicale
    expose:
      - "5232"
    healthcheck:
      test: ["CMD", "/app/bin/python", "-c", "import socket;s=socket.socket();s.settimeout(3);s.connect(('127.0.0.1',5232))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  svr1-apps:
    external: true
