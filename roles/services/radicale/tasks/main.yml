---
- name: Configure Radicale service user
  ansible.builtin.include_tasks: ../../../../tasks/service_user.yml
  vars:
    service_name: radicale
    service_uid: 903
    service_dirs:
      - /opt/stacks/radicale/data
      - /opt/stacks/radicale/config

- name: Copy Radicale config file
  ansible.builtin.copy:
    src: config/config
    dest: /opt/stacks/radicale/config/config
    owner: radicale
    group: radicale
    mode: "0644"
  register: radicale_config

- name: Deploy Radicale
  ansible.builtin.include_tasks: ../../../../tasks/deploy_stack.yml
  vars:
    service_name: radicale
    service_secrets: true
    # Radicale reads its config only at start, and compose does not notice a
    # change to a bind-mounted file. The users file needs no recreate: htpasswd
    # auth re-reads it on every login.
    compose_recreate: "{{ 'always' if radicale_config.changed else 'auto' }}"
    env_template: users.j2
    env_dest: /opt/stacks/radicale/config/users
    env_owner: radicale
    env_group: radicale
    env_mode: "0640"
