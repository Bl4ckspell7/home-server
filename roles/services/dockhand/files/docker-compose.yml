name: dockhand
services:
  dockhand:
    container_name: dockhand
    image: docker.io/fnsys/dockhand:v1.0.60@sha256:b8aed678af7563680d561db297fe513857c9adc263cc39e373c3434f0d1532e2
    restart: unless-stopped
    user: "905:905"
    group_add:
      # Host docker group, for socket access; .env is rendered by the role.
      - "${DOCKER_GID:?docker group id required}"
    expose:
      - "3000"
    networks:
      svr1-admin:
        aliases: [dockhand.lan]
    environment:
      DISABLE_LOCAL_LOGIN: "true"
      OIDC_AUTOLOGIN: "true"
    dns:
      - 172.28.3.254
    dns_search: # don't append any search domain
      - "."
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data # Must use bind mount, not named volume
      - /opt/stacks:/opt/stacks
    healthcheck:
      disable: false

networks:
  svr1-admin:
    external: true
