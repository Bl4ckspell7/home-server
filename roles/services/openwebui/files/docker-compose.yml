name: openwebui
services:
  openwebui:
    container_name: openwebui
    image: ghcr.io/open-webui/open-webui:v0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.239
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    env_file: .env
    environment:
      TZ: Europe/Berlin
      PORT: "3000"
      # Env only seeds a fresh DB (persistent config); later changes go through Admin Settings.
      WEBUI_URL: https://openwebui.${BASE_DOMAIN:?base domain required}
      CORS_ALLOW_ORIGIN: https://openwebui.${BASE_DOMAIN:?base domain required}
      # Authentik only. Admin follows authentik Admins, anyone else lands as pending.
      ENABLE_LOGIN_FORM: "False"
      ENABLE_PASSWORD_AUTH: "False"
      ENABLE_OAUTH_SIGNUP: "True"
      OAUTH_PROVIDER_NAME: Authentik
      OPENID_PROVIDER_URL: https://authentik.${BASE_DOMAIN:?base domain required}/application/o/openwebui/.well-known/openid-configuration
      OPENID_REDIRECT_URI: https://openwebui.${BASE_DOMAIN:?base domain required}/oauth/oidc/callback
      ENABLE_OAUTH_ROLE_MANAGEMENT: "True"
      OAUTH_ROLES_CLAIM: groups
      OAUTH_ADMIN_ROLES: authentik Admins
      # Models from two llama.cpp routers, set in .env: the desktop (GPU, only while it is on;
      # URL and key from sops) and llamacpp.lan here (CPU, always on).
      ENABLE_OLLAMA_API: "False"
      # Desktop off: don't stall the model list for the default 10 s.
      AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST: "3"
      # Titles, tags and search queries on the fast CPU model instead of the chat model;
      # follow-up suggestions would cost one more slow call per answer.
      TASK_MODEL_EXTERNAL: qwen3.5-2b-q6k
      ENABLE_FOLLOW_UP_GENERATION: "False"
      # Own SearXNG, internal (no Authentik); it searches via ProtonVPN like all svr1 egress.
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng.lan:8080/search?q=<query>
      # New chats start with web search and code interpreter on (Admin > Models > Model Defaults).
      DEFAULT_MODEL_METADATA: '{"defaultFeatureIds": ["web_search", "code_interpreter"]}'
      ANONYMIZED_TELEMETRY: "False"
      DO_NOT_TRACK: "True"
      SCARF_NO_ANALYTICS: "True"
    volumes:
      - openwebui_data:/app/backend/data

volumes:
  openwebui_data:

networks:
  svr1-network:
    external: true
