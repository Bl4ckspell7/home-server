version = 1

; Shared by all models. CPU only (Ryzen 5 3600): 6 threads beat 12 (12.6 vs 10.7 t/s),
; thinking off since it takes minutes at CPU speed and Linkwarden expects plain JSON.
[*]
jinja = true
flash-attn = on
threads = 6
reasoning = off

; Section name = model ID in the UI/API (Linkwarden OPENAI_MODEL). MoE with 4B active,
; HauhauCS "Balanced" uncensor (keeps some guardrails). Gemma sampling from the model card.
[gemma4-26b-a4b-iq2m]
model = /models/Gemma4-26B-A4B-Uncensored-HauhauCS-Balanced-IQ2_M.gguf
c = 16384
temp = 1.0
top-p = 0.95
top-k = 64
