version = 1

; Shared by all models. CPU only (Ryzen 5 3600): 6 threads beat 12 (12.6 vs 10.7 t/s),
; thinking off since it takes minutes at CPU speed and Linkwarden expects plain JSON.
[*]
jinja = true
flash-attn = on
threads = 6
reasoning = off

; Section name = model ID in the UI/API (Linkwarden OPENAI_MODEL). MoE with 4B active,
; HauhauCS "Balanced" uncensor (keeps some guardrails). Gemma sampling from the model card.
[gemma4-26b-a4b-iq2m]
model = /models/Gemma4-26B-A4B-Uncensored-HauhauCS-Balanced-IQ2_M.gguf
c = 16384
temp = 1.0
top-p = 0.95
top-k = 64

; Fast and small (~22 t/s, 154 t/s prompt, 2.2 GB RAM): quick chats and Open WebUI's
; background tasks (titles, tags, search queries). Weaker on reasoning than Gemma.
; Non-thinking sampling from the model card.
[qwen3.5-2b-q6k]
model = /models/Qwen3.5-2B-Uncensored-HauhauCS-Aggressive-Q6_K.gguf
c = 16384
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
