name: llamacpp
services:
  llamacpp:
    container_name: llamacpp
    image: ghcr.io/ggml-org/llama.cpp:server-b12063@sha256:10a38e6cc91760ab157f0a0a8546218d35f4a314432a70298abfa3d096829ad7
    restart: unless-stopped
    # Leak guard, not a sizing target: observed peak ~16.3G with Gemma4 IQ2_M loaded.
    mem_limit: 20g
    expose:
      - "8080"
    networks:
      svr1-network:
        ipv4_address: 172.21.255.241
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./models:/models:ro
      - ./models.ini:/models.ini:ro
    # Router mode, API only (chat UI is Open WebUI): one model loaded at a time, on first
    # request; unloaded after 15 min idle to give the RAM back.
    command:
      - --no-webui
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --models-preset
      - /models.ini
      - --models-max
      - "1"
      - --sleep-idle-seconds
      - "900"
    # The image's own HEALTHCHECK curls /health.

networks:
  svr1-network:
    external: true
