name: llamacpp
services:
  llamacpp:
    container_name: llamacpp
    image: ghcr.io/ggml-org/llama.cpp:server-b12648@sha256:20db01dc9a92bff54a5b9fe4078caa52be6a0c1fa73859c6449e25b9cb67f998
    restart: unless-stopped
    # Leak guard, not a sizing target: observed peak ~16.3G with Gemma4 IQ2_M loaded,
    # ~18.5G with the 2B model next to it.
    mem_limit: 22g
    expose:
      - "8080"
    networks:
      svr1-llm:
        aliases: [llamacpp.lan]
    dns:
      - 172.28.4.254
    dns_search:
      - "."
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./models:/models:ro
      - ./models.ini:/models.ini:ro
    # Router mode, API only (chat UI is Open WebUI): models load on first request; two at
    # once so Open WebUI's task model runs next to the chat model without reloads; each is
    # unloaded after 15 min idle to give the RAM back.
    command:
      - --no-webui
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --models-preset
      - /models.ini
      - --models-max
      - "2"
      - --sleep-idle-seconds
      - "900"
    # The image's own HEALTHCHECK curls /health.

networks:
  svr1-llm:
    external: true
