name: vaultwarden

services:
  vaultwarden:
    container_name: vaultwarden
    image: docker.io/vaultwarden/server:1.37.1@sha256:ebdfe70701c60ac0c28c697e787cea767d7972940b786037b29fe0d507f821e8
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default:
      svr1-network:
        ipv4_address: 172.21.255.232
    dns:
      - 172.21.255.254
    dns_search:
      - "."
    environment:
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:?admin token required}
      DATABASE_URL: postgresql://vaultwarden:${VAULTWARDEN_DB_PASSWORD:?database password required}@vaultwarden-postgres:5432/vaultwarden
      DOMAIN: https://vaultwarden.${BASE_DOMAIN:?base domain required}
      SIGNUPS_ALLOWED: "false"
    volumes:
      - vaultwarden_data:/data
    depends_on:
      vaultwarden-postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  vaultwarden-postgres:
    container_name: vaultwarden-postgres
    image: docker.io/library/postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultwarden
      POSTGRES_USER: vaultwarden
      POSTGRES_PASSWORD: ${VAULTWARDEN_DB_PASSWORD:?database password required}
    volumes:
      - vaultwarden_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  vaultwarden_data:
    name: vaultwarden_data
  vaultwarden_pgdata:
    name: vaultwarden_pgdata

networks:
  default:
    driver: bridge
  svr1-network:
    external: true
